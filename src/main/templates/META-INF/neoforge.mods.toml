modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Every line of behaviour in this mod is an injection into Forbidden and Arcanus'
# black hole. Without F&A the mixin plugin disables the whole config and the mod
# is inert, so the dependency stays optional rather than required - that keeps the
# jar safe to leave in a pack build that drops F&A.
[[dependencies.${mod_id}]]
modId="forbidden_arcanus"
type="optional"
versionRange="[2.6,)"
ordering="AFTER"
side="BOTH"
