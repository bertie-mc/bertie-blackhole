mod_name=Bertie Black Hole
mod_license=Unlicense
mod_version=0.3.0
mod_group_id=com.berlord.bertieblackhole
mod_authors=berlord
mod_description=Turns Forbidden and Arcanus' Black Hole into a levelled machine. Feed it configurable "counter" items until every counter for the next level is full, and the hole transforms - new sound, new particle colour, and a new set of exchange recipes. Base black hole behaviour (pull, XP to Xpetrified Orb) is untouched. Everything is driven by one JSON file in config/.

# Forbidden and Arcanus jar used for compileOnly type resolution of the mixin targets.
# Not shipped, not required at build time by anything else. Swap the filename here when
# the pack updates F&A and re-check the injection points.
fa_jar=forbidden_arcanus-2.6.1.jar
